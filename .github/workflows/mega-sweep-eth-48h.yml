name: Mega Sweep Extended ETH (48h)

# v14e.45 — split en matrix de 3 shards (jupiter / dexscreener / both) +
# merge job, miroir de mega-sweep-48h.yml. Avant: single 4h job qui s'est
# fait cancel à 4h00 (run 25118472430, max execution time exceeded).
# Maintenant chaque shard tourne en parallèle, le merge agrège les CSVs et
# persiste vers mega_sweep_runs (chain=ethereum).
#
# 22:00 UTC tous les 2 jours — offset 20h vs SOL (02:00) pour ne pas
# stacker la charge Supabase / GH-runner.
#
# Routing ideas + recall sweep skipped (Solana-specific). Slip sensitivity
# inclus pour round-trip robustness_ratio dans mega_sweep_runs (v14e.45 fix).

on:
  schedule:
    - cron: '0 22 */2 * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Lancer meme si la garde de fraicheur dit non"
        type: boolean
        default: false

jobs:
  # v14e.72b — garde de fraicheur.
  #
  # Le support ETH a ete construit pendant une ETH season. Elle est finie et ETH
  # est structurellement bien moins utilise que SOL en memecoins, donc le flux
  # est passe de ~74 tokens/semaine (fin avril) a 2-15 (depuis juin). Ce n'est
  # PAS un bug de pipeline, c'est la demande — rien a reparer cote scraper.
  #
  # L'univers du sweep (--mega-since 2026-04-13) compte encore 313 tokens, donc
  # le probleme n'est pas sa taille : c'est que 236 d'entre eux sont anterieurs a
  # juin. On rejouait 3 runners toutes les 48h sur un univers fige a 75% pour y
  # ajouter ~1.4 token. La garde porte donc sur la FRAICHEUR, pas sur le volume
  # total : sans donnee neuve, un re-run ne peut pas produire de conclusion neuve.
  #
  # Seuil 20 tokens / 14j. Au rythme actuel (~0.7/jour) la garde bloque et le
  # sweep se declenchera ~1x/mois. Si une ETH season revient (74/semaine = ~148
  # par 14j) elle passe des le run suivant, sans intervention.
  gate:
    name: garde-fraicheur-eth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.check.outputs.run }}
      fresh: ${{ steps.check.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Compter les tokens ETH recents
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python - <<'PY'
          import os, requests
          from datetime import datetime, timedelta, timezone

          # v14e.76: on ecrit dans $GITHUB_OUTPUT depuis Python, on ne redirige
          # PLUS stdout vers ce fichier. L'ancienne forme (`python ... >>
          # "$GITHUB_OUTPUT"`) y envoyait aussi les lignes `::notice::`, que le
          # runner refuse de parser: "Invalid format '::notice::SKIP — ...'"
          # => step en erreur => workflow ROUGE alors que la garde avait
          # correctement decide de sauter (run 31054936700, 05/08).
          def sortie(**kv):
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  for k, v in kv.items():
                      fh.write(f"{k}={v}\n")

          WINDOW_DAYS, MIN_FRESH = 14, 20
          since = (datetime.now(timezone.utc) - timedelta(days=WINDOW_DAYS)).isoformat()
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          try:
              r = requests.get(
                  f"{os.environ['SUPABASE_URL']}/rest/v1/paper_trades",
                  params={"select": "token_address", "chain": "eq.ethereum",
                          "source": "eq.rt", "created_at": f"gte.{since}"},
                  headers={"apikey": key, "Authorization": f"Bearer {key}"},
                  timeout=60)
              r.raise_for_status()
              fresh = len({row["token_address"] for row in r.json()})
          except Exception as e:
              # Fail OPEN: une garde qui casse ne doit pas masquer le sweep.
              sortie(run="true", fresh=-1)
              print(f"::warning::garde en echec ({e}) — on lance le sweep par defaut")
              raise SystemExit(0)

          forced = os.environ.get("FORCE", "").lower() == "true"
          go = fresh >= MIN_FRESH or forced
          sortie(run="true" if go else "false", fresh=fresh)
          msg = (f"{fresh} tokens ETH distincts sur {WINDOW_DAYS}j (seuil {MIN_FRESH})"
                 + (" — FORCE" if forced else ""))
          print(f"::notice::{'LANCE' if go else 'SKIP'} — {msg}")
          PY

  sweep:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      # Continue les autres shards même si un fail. Le merge skip les
      # CSVs manquants (concat tolère les absents).
      fail-fast: false
      matrix:
        source: [jupiter, dexscreener, both]
    name: sweep-eth-${{ matrix.source }}
    runs-on: ubuntu-latest
    # Marge sous le hard cap GH 6h. ETH single-job a tapé 4h00 sur run
    # 25118472430 → 1/3 par shard ≈ 80min. 350min garde-fou si scope grossit.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install supabase requests python-dotenv pandas numpy

      - name: Run mega sweep extended ETH (shard=${{ matrix.source }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # --chain ethereum + --mega-source-shard restreint la dim sources
          # à 1 valeur. Le reste du grid (filters × smoothings × polling ×
          # age_bands × strategies) tourne intégralement sous calibration ETH.
          # v14e.77: meme traitement que SOL. La correction de la fenetre de
          # ticks (sim.py, code partage) fait entrer TOUT l'univers ETH au lieu
          # des seuls tokens des 8 derniers jours — sur ETH, ou le flux est
          # tari depuis juin, c'est la difference entre ~2 tokens et les 313 de
          # l'univers. --mega-lean-grid evite que le grid lissage x cadence
          # ravale ce gain, et supprime les 70 quasi-doublons par config qui
          # faussaient les tests apparies.
          cd scraper
          python sim.py --mega-sweep-extended \
            --chain ethereum \
            --mega-lean-grid \
            --mega-source-shard ${{ matrix.source }} \
            --mega-workers 4 \
            --mega-csv-out _mega_sweep_eth_extended_${{ matrix.source }}.csv \
            2>&1 | tee sweep_eth_${{ matrix.source }}.out
          if [ -f _mega_sweep_eth_extended_${{ matrix.source }}.csv ]; then
            mv _mega_sweep_eth_extended_${{ matrix.source }}.csv ../
            echo "Shard ETH ${{ matrix.source }} CSV produced"
          else
            echo "sim.py did not produce shard CSV"
            exit 1
          fi

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-sweep-eth-shard-${{ matrix.source }}
          path: |
            _mega_sweep_eth_extended_${{ matrix.source }}.csv
            scraper/sweep_eth_${{ matrix.source }}.out
          retention-days: 7

  merge_and_analyze:
    needs: [gate, sweep]
    # always() garde le merge quand 1 shard a echoue (partiel > rien), mais il ne
    # doit pas tourner quand la garde a skip le sweep : il n'y aurait aucun CSV.
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # v14e.77: comme SOL — l'ANALYSE suit master, pas le SHA declencheur.
      # Sinon un correctif au script d'analyse pousse pendant les heures de
      # sweep n'est pas applique, et sa section manquante se lit "rien trouve"
      # au lieu de "pas execute".
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install supabase requests python-dotenv pandas numpy

      - name: Download shard CSVs
        uses: actions/download-artifact@v4
        with:
          pattern: mega-sweep-eth-shard-*
          merge-multiple: true

      - name: Concat shard CSVs into canonical _mega_sweep_eth_extended.csv
        id: concat
        run: |
          python - <<'PY'
          import os, glob, pandas as pd
          shards = sorted(glob.glob('_mega_sweep_eth_extended_*.csv'))
          if not shards:
              raise SystemExit('FATAL: no ETH shard CSV downloaded')
          dfs = []
          skipped = []
          for p in shards:
              # ETH Jupiter Ultra coverage is sparse — the jupiter shard often
              # comes back header-only or completely empty. Don't fail the merge
              # over it; just skip and continue with the other shards (both/ds).
              try:
                  df = pd.read_csv(p)
              except pd.errors.EmptyDataError:
                  print(f"  {p}: EMPTY (no parsable columns), skipping")
                  skipped.append(p)
                  continue
              if df.empty:
                  print(f"  {p}: 0 rows, skipping")
                  skipped.append(p)
                  continue
              print(f"  {p}: {len(df)} rows")
              dfs.append(df)
          if not dfs:
              raise SystemExit('FATAL: every ETH shard was empty')
          out = pd.concat(dfs, ignore_index=True)
          out.to_csv('_mega_sweep_eth_extended.csv', index=False)
          print(f"\nConcatenated -> _mega_sweep_eth_extended.csv ({len(out)} rows total)")
          if skipped:
              print(f"Skipped empty shards: {skipped}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"shards_found={len(shards)}\n")
              f.write(f"shards_used={len(dfs)}\n")
              f.write(f"shards_skipped={len(skipped)}\n")
              f.write(f"total_rows={len(out)}\n")
          PY

      - name: Annotate with FDR + family realism + persist to DB (chain=ethereum)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/analyze_mega_sweep.py \
            --csv _mega_sweep_eth_extended.csv \
            --alpha 0.05 \
            --top 30 \
            --persist \
            --persist-extra 50 \
            --chain ethereum \
            2>&1 | tee analyze_eth.out

      - name: Slippage robustness on top-robust ETH winners
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/_strat_slip_sensitivity.py \
            --top-csv _mega_sweep_eth_top_robust.csv \
            --top 20 \
            --days 14 \
            --persist-run-id ${{ github.run_id }} \
            --out data/slip_sensitivity_eth_latest.csv \
            2>&1 | tee slip_sensitivity_eth.out || true

      - name: Upload final ETH artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-sweep-eth-${{ github.run_id }}
          path: |
            _mega_sweep_eth_extended.csv
            _mega_sweep_eth_extended_annotated.csv
            _mega_sweep_eth_top_robust.csv
            _mega_sweep_eth_top_recent.csv
            analyze_eth.out
            slip_sensitivity_eth.out
            data/slip_sensitivity_eth_latest.csv
          retention-days: 30

      - name: Summary comment
        if: success()
        run: |
          echo "## Mega Sweep ETH v14e.45 (matrix split)" >> "$GITHUB_STEP_SUMMARY"
          echo "Shards merged: ${{ steps.concat.outputs.shards_found }}/3" >> "$GITHUB_STEP_SUMMARY"
          echo "Total rows: ${{ steps.concat.outputs.total_rows }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f _mega_sweep_eth_top_robust.csv ]; then
            echo "## Top 10 robust ETH configs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -11 _mega_sweep_eth_top_robust.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
