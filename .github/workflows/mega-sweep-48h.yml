name: Mega Sweep Extended (48h)

# v14e.43 — split en matrix de 3 shards (jupiter / dexscreener / both) +
# merge job. Avant: single 5h+ job qui dépassait le hard cap 6h des
# GitHub-hosted runners (timeout-minutes: 720 dans le YAML était ignoré).
# Maintenant chaque shard tourne ~2h en parallèle, le merge agrège les
# CSVs et fait toutes les analyses downstream (analyze + persist + slip-
# sensitivity + recall + routing). Total wall-clock ~2h30, marge confort.
#
# Tous les 2 jours à 02:00 UTC (offset des autres crons : 04:00 sim-align,
# 04:30 outlier, 05:00 shadow audit). Artefacts conservés 30j pour comparer
# les rankings dans le temps.

on:
  schedule:
    - cron: '0 2 */2 * *'
  workflow_dispatch: {}

jobs:
  sweep:
    strategy:
      # Continue les autres shards même si un fail — on perd 1/6 de coverage
      # mais pas tout. Le merge skip silencieusement les CSVs manquants.
      fail-fast: false
      matrix:
        source: [jupiter, dexscreener, both]
        # v14e.56: strat-shard secondaire — 3 sources x 2 strat-halves = 6 shards
        # parallèles. Chaque shard ~1.5-2h (était ~5-6h en v14e.43 avec source-only,
        # qui s'était mis a hit le cap 6h GH). Strat split deterministe par index
        # sorted % 2 dans sim.py — meme strat toujours dans meme shard.
        strat: ['1/2', '2/2']
    name: sweep-${{ matrix.source }}-s${{ matrix.strat }}
    runs-on: ubuntu-latest
    # Marge sous le hard cap GH 6h. v14e.56: ~1.5-2h/shard (moitie du job v14e.43
    # source-only). 350min = 5h50, garde-fou large.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install supabase requests python-dotenv pandas numpy

      - name: Compute shard tag (filesystem-safe)
        id: tag
        run: |
          # Replace '/' with '-' so '1/2' becomes '1-2' for filenames + artifact names
          STRAT_TAG="${{ matrix.strat }}"
          STRAT_TAG="${STRAT_TAG//\//-}"
          echo "strat_tag=${STRAT_TAG}" >> "$GITHUB_OUTPUT"
          echo "shard_tag=${{ matrix.source }}_s${STRAT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run mega sweep extended (source=${{ matrix.source }} strat=${{ matrix.strat }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # v14e.43: --mega-source-shard restreint la dim 'sources'.
          # v14e.56: --mega-strat-shard X/N split additionnel sur strategies.
          # Resultat: source x strat_half = 6 shards parallel sous cap GH 6h.
          cd scraper
          python sim.py --mega-sweep-extended \
            --mega-source-shard ${{ matrix.source }} \
            --mega-strat-shard ${{ matrix.strat }} \
            --mega-workers 4 \
            --mega-csv-out _mega_sweep_extended_${{ steps.tag.outputs.shard_tag }}.csv \
            2>&1 | tee sweep_${{ steps.tag.outputs.shard_tag }}.out
          if [ -f _mega_sweep_extended_${{ steps.tag.outputs.shard_tag }}.csv ]; then
            mv _mega_sweep_extended_${{ steps.tag.outputs.shard_tag }}.csv ../
            echo "Shard ${{ steps.tag.outputs.shard_tag }} CSV produced"
          else
            echo "sim.py did not produce shard CSV"
            exit 1
          fi

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-sweep-shard-${{ steps.tag.outputs.shard_tag }}
          path: |
            _mega_sweep_extended_${{ steps.tag.outputs.shard_tag }}.csv
            scraper/sweep_${{ steps.tag.outputs.shard_tag }}.out
          retention-days: 7

  merge_and_analyze:
    needs: sweep
    if: always()  # run merge even if 1 shard failed — partial is better than nothing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install supabase requests python-dotenv pandas numpy

      - name: Download shard CSVs
        uses: actions/download-artifact@v4
        with:
          pattern: mega-sweep-shard-*
          merge-multiple: true

      - name: Concat shard CSVs into canonical _mega_sweep_extended.csv
        id: concat
        run: |
          # Concat any shard CSV present. Drop duplicate header on rows 2+.
          # Order doesn't matter (analyze_mega_sweep sorts internally).
          python - <<'PY'
          import os, glob, pandas as pd
          shards = sorted(glob.glob('_mega_sweep_extended_*.csv'))
          if not shards:
              raise SystemExit('FATAL: no shard CSV downloaded')
          dfs = []
          skipped = []
          for p in shards:
              # Guard against header-only or fully empty shards (rare on SOL but
              # mirrors the ETH workflow fix — one empty shard shouldn't kill
              # the whole merge if the others have data).
              try:
                  df = pd.read_csv(p)
              except pd.errors.EmptyDataError:
                  print(f"  {p}: EMPTY (no parsable columns), skipping")
                  skipped.append(p)
                  continue
              if df.empty:
                  print(f"  {p}: 0 rows, skipping")
                  skipped.append(p)
                  continue
              print(f"  {p}: {len(df)} rows")
              dfs.append(df)
          if not dfs:
              raise SystemExit('FATAL: every shard was empty')
          out = pd.concat(dfs, ignore_index=True)
          out.to_csv('_mega_sweep_extended.csv', index=False)
          print(f"\nConcatenated -> _mega_sweep_extended.csv ({len(out)} rows total)")
          if skipped:
              print(f"Skipped empty shards: {skipped}")
          # Surface to next step
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"shards_found={len(shards)}\n")
              f.write(f"shards_used={len(dfs)}\n")
              f.write(f"shards_skipped={len(skipped)}\n")
              f.write(f"total_rows={len(out)}\n")
          PY

      - name: Annotate with FDR + family realism + persist to DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # v14e.34: --persist writes top-30 robust + 50 runners-up into the
          # mega_sweep_runs Supabase table tagged with this run_id. The
          # calibration script downstream joins these predictions against
          # realized paper_trades to detect sim/actual drift over time.
          python scripts/analyze_mega_sweep.py \
            --csv _mega_sweep_extended.csv \
            --alpha 0.05 \
            --top 30 \
            --persist \
            --persist-extra 50 \
            2>&1 | tee analyze.out

      - name: Sim/actual calibration report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/_mega_sweep_calibration.py --window-days 7 \
            2>&1 | tee sim_calibration.out || true

      - name: Slippage robustness on top-robust winners
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/_strat_slip_sensitivity.py \
            --top-csv _mega_sweep_top_robust.csv \
            --top 20 \
            --days 14 \
            --persist-run-id ${{ github.run_id }} \
            --out data/slip_sensitivity_latest.csv \
            2>&1 | tee slip_sensitivity.out || true

      - name: Recall sweep (v14e.41)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/_recall_sweep.py \
            --output scraper/_recall_sweep.csv \
            2>&1 | tee recall_sweep.out || true

      - name: Routing ideas refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p data
          python scripts/_analyze_routing_ideas.py 2>&1 | tee routing.out || true
          python scripts/_quantify_routing_dollar_day.py 2>&1 | tee routing_dollar_day.out || true

      - name: Upload final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-sweep-${{ github.run_id }}
          path: |
            _mega_sweep_extended.csv
            _mega_sweep_extended_annotated.csv
            _mega_sweep_top_robust.csv
            _mega_sweep_top_recent.csv
            analyze.out
            routing.out
            routing_dollar_day.out
            slip_sensitivity.out
            sim_calibration.out
            data/routing_ideas_*.json
            data/slip_sensitivity_*.csv
            data/sim_calibration_*.csv
            scraper/_recall_sweep.csv
            recall_sweep.out
          retention-days: 30

      - name: Summary comment
        if: success()
        run: |
          echo "## Mega Sweep v14e.56 (matrix split 3 sources x 2 strat-halves = 6 shards)" >> "$GITHUB_STEP_SUMMARY"
          echo "Shards merged: ${{ steps.concat.outputs.shards_found }}/6" >> "$GITHUB_STEP_SUMMARY"
          echo "Total rows: ${{ steps.concat.outputs.total_rows }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f _mega_sweep_top_robust.csv ]; then
            echo "## Top 10 robust configs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -11 _mega_sweep_top_robust.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
