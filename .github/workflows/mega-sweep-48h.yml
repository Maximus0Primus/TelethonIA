name: Mega Sweep Extended (48h)

# v14e.12 — génère `_mega_sweep_extended.csv` (~500K-800K configs) via
# scraper/sim.py puis annote avec `scripts/analyze_mega_sweep.py`
# (family_realism + FDR/Bonferroni). Tous les 2 jours à 02:00 UTC — timing
# choisi pour éviter de chevaucher les autres crons (04:00 sim-align,
# 04:30 outlier, 05:00 shadow audit).
#
# Artefacts uploadés 30j pour pouvoir comparer les rankings au cours du
# temps (shadow promotion, slip recalibration impact, v144.13 family mult
# drift, etc.). Pas d'alerte Telegram — post-processeur analytique, user
# check manuel via /best /shadow ou téléchargement artifact.

on:
  schedule:
    # "0 2 */2 * *" = tous les 2 jours à 02:00 UTC. GitHub uses UTC.
    - cron: '0 2 */2 * *'
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    # v14e.41: --mega-sweep-extended sur SOL = 4M configs = ne finit pas dans
    # 5h sur GH runner 2-worker. Run Apr 27 cancelled @ 5h. Switché à
    # --mega-sweep (1/5 des configs ~800K) + workers=4 (full vCPU) →
    # finit en ~1h. Timeout 540min en safety pour absorber Supabase tick fetch
    # + post-processing (analyze + recall_sweep + slip_sensitivity + routing).
    timeout-minutes: 540

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install supabase requests python-dotenv pandas numpy

      - name: Run mega sweep
        id: sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # v14e.41: --mega-sweep (NOT extended) — 1/5 des configs (~800K vs 4M).
          # Le run extended SOL Apr 27 a timeout @ 5h car 188 tokens × 4M configs
          # × 2 workers > 5h. Le mode standard est largement suffisant pour le
          # ranking robust + persist en DB. ETH garde --extended (universe 3×
          # plus petit, finit en 2h39m).
          # Workers: 4 = full vCPU du GH runner. Output forcé sur le nom standard
          # `_mega_sweep_extended.csv` pour que analyze_mega_sweep.py (default
          # path) le lise sans modif.
          cd scraper
          python sim.py --mega-sweep \
            --mega-workers 4 \
            --mega-csv-out _mega_sweep_extended.csv \
            2>&1 | tee sweep.out
          if [ -f _mega_sweep_extended.csv ]; then
            mv _mega_sweep_extended.csv ../
            echo "_mega_sweep_extended.csv produced"
          else
            echo "sim.py did not produce _mega_sweep_extended.csv"
            exit 1
          fi

      - name: Annotate with FDR + family realism
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # v14e.34: --persist writes top-30 robust + 50 runners-up into the
          # mega_sweep_runs Supabase table tagged with this run_id. The
          # calibration script downstream joins these predictions against
          # realized paper_trades to detect sim/actual drift over time.
          python scripts/analyze_mega_sweep.py \
            --csv _mega_sweep_extended.csv \
            --alpha 0.05 \
            --top 30 \
            --persist \
            --persist-extra 50 \
            2>&1 | tee analyze.out

      - name: Sim/actual calibration report
        # v14e.34: reads mega_sweep_runs (filled by --persist above and by
        # past runs) and joins predictions vs realized paper $/day in the
        # 7d post-run window. Detects chronic over-estimators (sim too
        # optimistic) per strategy and per family. Output stays as artifact.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/_mega_sweep_calibration.py --window-days 7 \
            2>&1 | tee sim_calibration.out || true

      - name: Slippage robustness on top-robust winners
        # v14e.34 — re-evaluates each top winning strategy at slip levels
        # {50, 100, 225, 400, 600, 800} bps. Strats whose $/day flips sign or
        # rank drops sharply at high slip are FRAGILE — flagged before any
        # promotion. Direct response to the JSONB drift bug (Apr 27): we
        # discovered $40K of recalc damage that was invisible because slip
        # was assumed constant.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/_strat_slip_sensitivity.py \
            --top-csv _mega_sweep_top_robust.csv \
            --top 20 \
            --days 14 \
            --out data/slip_sensitivity_latest.csv \
            2>&1 | tee slip_sensitivity.out || true

      - name: Recall sweep (v14e.41 — first_call vs recall vs union)
        # v14e.41: tests each exit spec on first_call universe + recall buckets
        # (DIP10/30/50, PEAK30/50/70) + union (first_call ∪ recall_dipXX).
        # Confirms whether adding recall opens to a base strategy improves EV.
        # 14d backtest established: FAST60_TP40_SL30 + recall_dip30 lifted
        # cum $sum +49% vs first_call alone. Output: scraper/_recall_sweep.csv.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/_recall_sweep.py \
            --output scraper/_recall_sweep.csv \
            2>&1 | tee recall_sweep.out || true

      - name: Routing ideas refresh (per-KOL specialization + score-band gate)
        # v14e.22: re-test the 4 routing hypotheses on the latest paper data
        # alongside the strat-pool sweep. Apples-to-apples comparison on the
        # same opportunity set. Output a sidecar JSON with verdicts so a
        # future session can see if signals strengthen as data accumulates.
        # Negative findings are also captured so we don't re-litigate them.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p data
          python scripts/_analyze_routing_ideas.py 2>&1 | tee routing.out || true
          python scripts/_quantify_routing_dollar_day.py 2>&1 | tee routing_dollar_day.out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-sweep-${{ github.run_id }}
          path: |
            _mega_sweep_extended.csv
            _mega_sweep_extended_annotated.csv
            _mega_sweep_top_robust.csv
            scraper/sweep.out
            analyze.out
            routing.out
            routing_dollar_day.out
            slip_sensitivity.out
            sim_calibration.out
            data/routing_ideas_*.json
            data/slip_sensitivity_*.csv
            data/sim_calibration_*.csv
            scraper/_recall_sweep.csv
            recall_sweep.out
          retention-days: 30

      - name: Summary comment
        if: success()
        run: |
          # Extrait le top 10 robust pour visibilité dans GH Actions UI
          if [ -f _mega_sweep_top_robust.csv ]; then
            echo "## Top 10 robust configs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -11 _mega_sweep_top_robust.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
