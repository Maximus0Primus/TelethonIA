name: Run Tests

on:
  push:
    paths: ['scraper/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['scraper/**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Run tests
        working-directory: scraper
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing -x
